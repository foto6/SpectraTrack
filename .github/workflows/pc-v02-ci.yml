name: SpectraTrack PC v0.2 CI

on:
  push:
    branches: [pc-v0.2]
    paths:
      - 'pc/**'
      - 'docs/PC_V02_PLAN.md'
      - '.github/workflows/pc-v02-ci.yml'
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: pc
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Windows dependencies
        run: |
          python -m pip install -U pip
          pip install -r requirements-win.txt
      - name: Compile and test
        run: |
          python -m compileall -q spectratrack tests
          pytest -q
      - name: Package PC source
        shell: pwsh
        run: |
          Compress-Archive -Path spectratrack,tests,README.md,pyproject.toml,requirements-win.txt,run_camera.bat,run_demo.bat -DestinationPath SpectraTrack-PC-v0.2-source.zip -Force
      - uses: actions/upload-artifact@v4
        with:
          name: SpectraTrack-PC-v0.2-source
          path: pc/SpectraTrack-PC-v0.2-source.zip
          if-no-files-found: error

  linux-algorithms:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pc
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install algorithm-test dependencies
        run: |
          python -m pip install -U pip
          pip install numpy==2.5.3 opencv-python-headless==4.14.0.94 pytest
      - name: Compile and test algorithms
        run: |
          python -m compileall -q spectratrack tests
          pytest -q
