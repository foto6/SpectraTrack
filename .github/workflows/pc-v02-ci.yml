name: SpectraTrack PC v0.2 CI

on:
  push:
    branches: [pc-v0.2]
    paths:
      - 'pc/**'
      - 'docs/PC_V02_PLAN.md'
      - '.github/workflows/pc-v02-ci.yml'
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: pc
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Windows dependencies
        run: |
          python -m pip install -U pip
          pip install -r requirements-win.txt
      - name: Compile and test
        run: |
          python -m compileall -q spectratrack tests
          python -m py_compile launcher.py
          pytest -q
      - name: Package PC source
        shell: pwsh
        run: |
          Compress-Archive -Path spectratrack,tests,README.md,pyproject.toml,requirements-win.txt,run_camera.bat,run_demo.bat,launcher.py -DestinationPath SpectraTrack-PC-v0.2-source.zip -Force
      - uses: actions/upload-artifact@v4
        with:
          name: SpectraTrack-PC-v0.2-source
          path: pc/SpectraTrack-PC-v0.2-source.zip
          if-no-files-found: error

  windows-standalone:
    needs: windows
    runs-on: windows-latest
    defaults:
      run:
        working-directory: pc
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install runtime and PyInstaller
        run: |
          python -m pip install -U pip
          pip install -r requirements-win.txt
          pip install "pyinstaller>=6,<7"
      - name: Build standalone directory
        run: |
          pyinstaller --noconfirm --clean --onedir --console --name SpectraTrack --collect-all onnxruntime launcher.py
      - name: Smoke test executable
        shell: pwsh
        run: |
          & .\dist\SpectraTrack\SpectraTrack.exe --help
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Add documentation and package
        shell: pwsh
        run: |
          Copy-Item README.md dist\SpectraTrack\README-PC.md
          @"
          SpectraTrack PC v0.2
          
          Double-click SpectraTrack.exe to choose an ONNX model and open camera 0.
          A sidecar <model>.manifest.json is detected automatically by the launcher.
          
          For advanced options open PowerShell in this folder:
          .\SpectraTrack.exe --help
          "@ | Set-Content -Encoding UTF8 dist\SpectraTrack\START-HERE.txt
          Compress-Archive -Path dist\SpectraTrack\* -DestinationPath SpectraTrack-PC-v0.2-standalone.zip -Force
      - uses: actions/upload-artifact@v4
        with:
          name: SpectraTrack-PC-v0.2-standalone
          path: pc/SpectraTrack-PC-v0.2-standalone.zip
          if-no-files-found: error

  linux-algorithms:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pc
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install algorithm-test dependencies
        run: |
          python -m pip install -U pip
          pip install numpy==2.5.3 opencv-python-headless==4.14.0.94 pytest
      - name: Compile and test algorithms
        run: |
          python -m compileall -q spectratrack tests
          python -m py_compile launcher.py
          pytest -q
