name: SpectraTrack PC CI

on:
  push:
    branches: [main]
    paths:
      - 'pc/**'
      - 'models/**'
      - 'tools/**'
      - '.github/workflows/ci.yml'
  pull_request:
    paths:
      - 'pc/**'
      - 'models/**'
      - 'tools/**'
      - '.github/workflows/ci.yml'
  workflow_dispatch:

jobs:
  pc-tests:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: pc
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: |
          python -m pip install -U pip
          pip install -r requirements-win.txt
          pip install -r requirements-build.txt
      - name: Compile and test
        run: |
          python -m compileall -q spectratrack tests
          pytest -q
      - name: Synthetic benchmark smoke test
        run: python -m spectratrack.benchmark --frames 500 --targets 24
      - name: Diagnostics
        run: python -m spectratrack.diagnostics
      - name: Build standalone Windows app
        run: |
          pyinstaller --noconfirm --clean --onedir --name SpectraTrack-PC --collect-all onnxruntime run_spectratrack.py
      - name: Smoke test standalone app
        run: .\dist\SpectraTrack-PC\SpectraTrack-PC.exe --help
      - name: Package PC source
        shell: pwsh
        run: |
          Compress-Archive -Path * -DestinationPath SpectraTrack-PC-source.zip -Force
      - name: Package Windows app
        shell: pwsh
        run: |
          Compress-Archive -Path dist\SpectraTrack-PC\* -DestinationPath SpectraTrack-PC-Windows.zip -Force
      - name: Upload PC source
        uses: actions/upload-artifact@v4
        with:
          name: SpectraTrack-PC-source
          path: pc/SpectraTrack-PC-source.zip
      - name: Upload Windows app
        uses: actions/upload-artifact@v4
        with:
          name: SpectraTrack-PC-Windows
          path: pc/SpectraTrack-PC-Windows.zip
