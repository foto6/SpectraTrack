name: SpectraTrack PC CI

on:
  push:
    branches: [main]
    paths:
      - 'pc/**'
      - 'models/**'
      - 'tools/**'
      - '.github/workflows/ci.yml'
  pull_request:
    paths:
      - 'pc/**'
      - 'models/**'
      - 'tools/**'
      - '.github/workflows/ci.yml'
  workflow_dispatch:

jobs:
  pc-tests:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: pc
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: |
          python -m pip install -U pip
          pip install -r requirements-win.txt
      - name: Compile and test
        run: |
          python -m compileall -q spectratrack tests
          pytest -q
      - name: Synthetic benchmark smoke test
        run: python -m spectratrack.benchmark --frames 500 --targets 24
      - name: Diagnostics
        run: python -m spectratrack.diagnostics
      - name: Package PC source
        shell: pwsh
        run: |
          Compress-Archive -Path * -DestinationPath SpectraTrack-PC-source.zip -Force
      - name: Upload PC package
        uses: actions/upload-artifact@v4
        with:
          name: SpectraTrack-PC-source
          path: pc/SpectraTrack-PC-source.zip
