name: Publish SpectraTrack v0.2.2

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/release-v0.2.2.yml'
      - 'RELEASE_NOTES_v0.2.2.md'
  workflow_dispatch:

permissions:
  contents: write

env:
  TAG_NAME: v0.2.2

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: pc
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install build dependencies
        run: |
          python -m pip install -U pip
          pip install -r requirements-win.txt
          pip install -r requirements-build.txt
      - name: Verify PC source
        run: |
          ruff check spectratrack tests
          python -m compileall -q spectratrack tests
          pytest -q
          python -m spectratrack.selfcheck
      - name: Build standalone Windows app
        run: |
          pyinstaller --noconfirm --clean --onedir --name SpectraTrack-PC --collect-all onnxruntime run_spectratrack.py
      - name: Smoke test executable
        run: .\dist\SpectraTrack-PC\SpectraTrack-PC.exe --help
      - name: Add runtime files
        shell: pwsh
        run: |
          Copy-Item START_SPECTRATRACK.bat dist\SpectraTrack-PC\START_SPECTRATRACK.bat
          Copy-Item calibration.example.json dist\SpectraTrack-PC\calibration.example.json
          Copy-Item STANDALONE_README.txt dist\SpectraTrack-PC\README.txt
          Copy-Item -Recurse presets dist\SpectraTrack-PC\presets
          Copy-Item ..\models\README.md dist\SpectraTrack-PC\MODEL_SETUP.md
          Copy-Item ..\models\model-manifest.example.json dist\SpectraTrack-PC\model-manifest.example.json
      - name: Package Windows release
        shell: pwsh
        run: |
          Compress-Archive -Path dist\SpectraTrack-PC\* -DestinationPath ..\SpectraTrack-Windows-x64.zip -Force
      - uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: SpectraTrack-Windows-x64.zip
          if-no-files-found: error

  android:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Locate sdkmanager
        shell: bash
        run: |
          SDKMANAGER="$(find "$ANDROID_SDK_ROOT/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          test -x "$SDKMANAGER"
          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"
      - name: Accept Android SDK licenses
        shell: bash
        run: yes | "$SDKMANAGER" --licenses > /dev/null || true
      - name: Install Android SDK 36
        shell: bash
        run: |
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'
      - name: Build Android APK
        working-directory: android
        run: gradle :app:assembleDebug --stacktrace
      - name: Normalize APK filename
        run: cp android/app/build/outputs/apk/debug/app-debug.apk SpectraTrack-Android.apk
      - uses: actions/upload-artifact@v4
        with:
          name: release-android
          path: SpectraTrack-Android.apk
          if-no-files-found: error

  release:
    needs: [windows, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: release-windows
          path: release
      - uses: actions/download-artifact@v4
        with:
          name: release-android
          path: release
      - name: Generate checksums
        shell: bash
        run: |
          cd release
          sha256sum SpectraTrack-Windows-x64.zip SpectraTrack-Android.apk > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - name: Publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            gh release upload "$TAG_NAME" release/SpectraTrack-Windows-x64.zip release/SpectraTrack-Android.apk release/SHA256SUMS.txt --clobber
            gh release edit "$TAG_NAME" --title "SpectraTrack v0.2.2" --notes-file RELEASE_NOTES_v0.2.2.md
          else
            gh release create "$TAG_NAME"               --target "$GITHUB_SHA"               --title "SpectraTrack v0.2.2"               --notes-file RELEASE_NOTES_v0.2.2.md               release/SpectraTrack-Windows-x64.zip               release/SpectraTrack-Android.apk               release/SHA256SUMS.txt
          fi
