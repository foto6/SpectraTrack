[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "spectratrack"
version = "0.3.0"
description = "Local-only object detection/tracking HUD for Windows and camera feeds"
requires-python = ">=3.12"

[tool.setuptools]
packages = ["spectratrack"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
