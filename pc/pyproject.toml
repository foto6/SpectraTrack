[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "spectratrack"
version = "0.2.0"
description = "Local-only object detection/tracking HUD for Windows and camera feeds"
requires-python = ">=3.12"

[project.scripts]
spectratrack = "spectratrack.app:main"
spectratrack-benchmark = "spectratrack.benchmark:main"
spectratrack-diagnostics = "spectratrack.diagnostics:main"
spectratrack-session = "spectratrack.session_analyze:main"
spectratrack-calibrate = "spectratrack.calibrate:main"
spectratrack-replay = "spectratrack.replay:main"

[tool.setuptools]
packages = ["spectratrack"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
